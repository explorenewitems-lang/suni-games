name: Build Suni Games APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "index.html"
      - "site.webmanifest"
      - "icon.svg"
      - "icon-*.png"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses < <(yes)
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Suni-Games-1.0.0.apk

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: suni-games-android-v1
          name: Suni Games Android
          body: Install the APK on Android. The app opens Suni Games fullscreen and requires an internet connection.
          files: Suni-Games-1.0.0.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
